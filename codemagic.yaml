workflows:
  labrecorder-ios-ci:
    name: LabRecorder iOS CI
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      vars:
        BUNDLE_ID: com.PhoHale.labrecorderios
        XCODE_WORKSPACE: ios/LabRecorderiOS.xcworkspace
        XCODE_SCHEME: LabRecorderiOS
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: '*'
          include: true
          source: true
    scripts:
      - name: Simulator tests
        script: |
          set -euo pipefail
          xcodebuild test \
            -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -testPlan LabRecorderiOS \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest' \
            -configuration Debug \
            -resultBundlePath "$CM_BUILD_DIR/LabRecorderiOS.xcresult" \
            CODE_SIGNING_ALLOWED=NO
    artifacts:
      - LabRecorderiOS.xcresult
      - /tmp/xcodebuild_logs/*.log

  labrecorder-ios-testflight:
    name: LabRecorder iOS TestFlight
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      # Must match the Codemagic Developer Portal API key reference name exactly.
      app_store_connect: PhoHale
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.PhoHale.labrecorderios
      xcode: latest
      vars:
        BUNDLE_ID: com.PhoHale.labrecorderios
        XCODE_WORKSPACE: ios/LabRecorderiOS.xcworkspace
        XCODE_SCHEME: LabRecorderiOS
        # App Store Connect → App Information → Apple ID
        APP_STORE_APPLE_ID: "6838915604"
    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Increment build number
        script: |
          set -euo pipefail
          cd ios
          # Prefer ASC/TestFlight latest; tolerate missing APP_STORE_APPLE_ID or empty history.
          raw="$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" --platform IOS --all-versions 2>/dev/null || true)"
          LATEST="$(printf '%s\n' "$raw" | tail -n 1 | tr -d '[:space:]')"
          if ! [[ "$LATEST" =~ ^[0-9]+$ ]]; then
            LATEST=0
          fi
          NEXT=$((LATEST + 1))
          echo "Using build number: $NEXT (ASC/TestFlight latest=$LATEST)"
          # Shared.xcconfig is the source of truth for CURRENT_PROJECT_VERSION in this project.
          sed -i '' "s/^CURRENT_PROJECT_VERSION = .*/CURRENT_PROJECT_VERSION = ${NEXT}/" Config/Shared.xcconfig
          agvtool new-version -all "$NEXT" || true
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --workspace "$CM_BUILD_DIR/$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
